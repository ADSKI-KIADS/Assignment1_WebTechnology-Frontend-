<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contact</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <header>
        <nav class="navbar">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
                <li><a href="catalog.html">catalog</a></li>
            </ul>
        </nav>
        </header>
        <form action="#" method="post">
        <fieldset>
            <legend>Contact Information</legend>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required maxlength="50" placeholder="Max Doe"><br><br>
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>
            
            <label for="Age">Age:</label>
            <input type="number" id="Age" name="Age" required min="1" max="120"><br><br>
            
            <label for="DoB">Date of Birth:</label>
            <input type="date" id="DoB" name="DoB" required><br><br>
            
            <label for="message">Message:</label><br>
            <textarea id="message" name="message" rows="4" cols="50" required></textarea><br><br>
            
        </fieldset>

        <fieldset>
            <legend>Membership preferences</legend>

            <p>Preferred library branch:</p>

            <div>
                <input type="radio" id="branch-main" name="branch" value="main" >
                <label for="branch-main">Main reading hall </label>
            </div>
            
            <div>
                <input type="radio" id="branch-digital" name="branch" value="digital">
                <label for="branch-digital">Digital media room</label>
            </div>

            <div>
                <input type="radio" id="branch-children" name="branch" value="children">
                <label for="branch-children">Children's section</label>
            </div>

        </fieldset>

        <button type="submit">Send Request</button>
        </form>
    </body>
</html>
